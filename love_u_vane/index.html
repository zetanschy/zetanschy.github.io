-gradient(160deg,#fdf3f6,#f2d7e0);border-radius:.9rem;cursor:pointer;border:0;padding:0;display:block;box-shadow:0 1.75rem 3.5rem rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.25) inset;transition:transform .5s cubic-bezier(0.22,1,0.36,1),box-shadow .5s ease;animation:float 6s ease-in-out infinite}.envelope:hover,.envelope:focus-visible{transform:translateY(-0.5rem) rotate(-1deg);box-shadow:0 2.25rem 4.5rem rgba(0,0,0,0.55)}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.65rem)}}.envelope__flap{position:absolute;inset:0 0 auto;height:62%;background:linear-gradient(175deg,#f8e2ea,#e9c3d1);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:.9rem .9rem 0 0;transform-origin:top;transition:transform .7s cubic-bezier(0.5,0,0.3,1.4)}.envelope.is-open .envelope__flap{transform:rotateX(180deg)}.envelope__seal{position:absolute;top:52%;left:50%;translate:-50% -50%;width:3.4rem;height:3.4rem;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ff7b95,var(--rose-deep));display:grid;place-items:center;font-size:1.4rem;color:#fff;box-shadow:0 .4rem 1rem rgba(94,8,32,0.5);z-index:2}.envelope__to{position:absolute;bottom:1.15rem;left:0;right:0;font-family:var(--script);font-size:1.85rem;color:#8d2246;z-index:2}.hint{font-size:.85rem;color:var(--ink-faint);letter-spacing:.05em}.pup{font-size:clamp(3rem,12vw,4.5rem);line-height:1;display:block;margin:0 auto .5rem;animation:pup-bounce 1.6s ease-in-out infinite;transform-origin:50% 90%}@keyframes pup-bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-0.55rem) rotate(4deg)}}.pups{display:flex;justify-content:center;gap:.75rem;margin-top:1.5rem}.pups .pup{font-size:clamp(2.25rem,8vw,3rem);margin:0}.pups .pup:nth-child(2){animation-delay:.25s}.pups .pup:nth-child(3){animation-delay:.5s}#scene-ask{text-align:center}

.cal__handle::after{content:"";width:1.75rem;height:3px;border-radius:999px;background:rgba(255,255,255,0.8)}.cal__handle--t{top:-0.62rem}.cal__handle--b{bottom:-0.62rem}.cal__hint{font-size:.72rem;color:var(--ink-faint);margin:.7rem 0 0;text-align:center}.picker__out{font-family:var(--serif);font-size:clamp(1.15rem,3.4vw,1.45rem);color:var(--gold);min-height:1.6em;margin:1.6rem 0 0;text-align:center}.picker__go{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-top:.9rem}.picker__go .btn[disabled]{opacity:.3;cursor:not-allowed;box-shadow:none}.picker__go .btn[disabled]:hover{transform:none}.custom{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}.custom input{flex:1 1 12rem;min-width:0;font-family:var(--serif);font-size:1.1rem;color:var(--ink);background:rgba(255,255,255,0.06);border:1px solid var(--glass-line);border-radius:1rem;padding:1rem 1.15rem}.custom input::placeholder{color:var(--ink-faint)}.custom input:focus{outline:0;border-color:var(--rose);background:rgba(255,93,126,0.1)}#scene-end{text-align:center}.bigname{font-family:var(--script);font-size:clamp(4rem,18vw,9rem);line-height:1;background:linear-gradient(120deg,#ffd9a8,var(--rose) 45%,#ff9ec2);-webkit-background-clip:text;background-clip:text;color:transparent;margin:.5rem 0 1.25rem;filter:drop-shadow(0 .5rem 1.75rem rgba(255,93,126,0.35))}.recap{display:grid;gap:.6rem;margin:2rem auto;text-align:left;max-width:26rem}.recap-row{display:flex;align-items:center;gap:.85rem;padding:.85rem 1.15rem;border-radius:.9rem;background:rgba(255,255,255,0.05);border:1px solid var(--glass-line);opacity:0;animation:rise .7s cubic-bezier(0.22,1,0.36,1) forwards}.recap-row .emoji{font-size:1.35rem}.recap-row .k{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:.15rem}.recap-row .v{font-family:var(--serif);font-size:1.15rem}.shake{animation:shake .6s cubic-bezier(0.36,0.07,0.19,0.97)}@keyframes shake{10%,90%{transform:translate(-2px,1px)}30%,70%{transform:translate(5px,-3px)}50%{transform:translate(-6px,2px)}}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.pup,.recap-row{opacity:1;transform:none}}</style> </head> <body> <canvas id="sky" aria-hidden="true"></canvas> <main class="stage"> <section class="scene is-active" id="scene-intro" aria-label="Un sobre para ti"> <button class="envelope" id="envelope" type="button" aria-label="Abrir la carta"> <span class="envelope__flap"></span> <span class="envelope__seal">❤</span> <span class="envelope__to">Para Vane</span> </button> <p class="hint">Toca el sobre</p> </section> <section class="scene" id="scene-ask" aria-label="La pregunta"> <div class="card"> <span class="pup" aria-hidden="true">🐶</span> <p class="eyebrow">La pregunta</p> <h1>¿Salimos?</h1> <div class="ask-row"> <button class="btn" id="btn-yes" type="button">Sí ❤</button> <button class="btn" id="btn-no" type="button">No</button> </div> <p class="tease" id="tease" role="status" aria-live="polite"></p> </div> </section> <section class="scene" id="scene-plan" aria-label="Planeando la cita"> <div class="card"> <div class="steps" id="steps" aria-hidden="true"> <div class="steps__track"> <span class="steps__fill" id="steps-fill"></span> </div> <span class="steps__dog" id="steps-dog">🐕</span> </div> <p class="eyebrow" id="plan-eyebrow">Paso 1 de 3</p> <h2 id="plan-question"></h2> <div class="options" id="plan-options" role="group" aria-labelledby="plan-question"></div> </div> </section> <section class="scene" id="scene-end" aria-label="Es una cita"> <div class="card"> <p class="bigname">Te amo</p> <div class="recap" id="recap"></div> <div class="pups" aria-hidden="true"> <span class="pup">🐕</span> <span class="pup">🐶</span> <span class="pup">🐩</span> </div> </div> </section> </main> <p class="sr-only" id="live" role="status" aria-live="polite"></p> <script>
      (function () {
        "use strict";

        /* Endpoint de Formspree, del tipo "https://formspree.io/f/xxxxxxxx".
           Si se deja vacío, la página simplemente no manda nada. */
        var FORM_ENDPOINT = "https://formspree.io/f/mwlevlpy";

        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* ------------------------------------------------ escenas */
        function show(id) {
          document.querySelectorAll(".scene").forEach(function (s) {
            s.classList.toggle("is-active", s.id === id);
          });
          // el "no" escapado vive en el body, así que hay que esconderlo a mano
          var loose = document.getElementById("btn-no");
          if (loose.classList.contains("is-loose")) loose.style.display = id === "scene-ask" ? "" : "none";
          window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
        }

        /* ------------------------------------------------ el sobre */
        var envelope = document.getElementById("envelope");
        envelope.addEventListener("click", function () {
          envelope.classList.add("is-open");
          burst(window.innerWidth / 2, window.innerHeight / 2, 40);
          setTimeout(function () {
            show("scene-ask");
          }, 750);
        });

        /* ------------------------------------------------ sí / no */
        var yes = document.getElementById("btn-yes");
        var no = document.getElementById("btn-no");
        var tease = document.getElementById("tease");
        var teases = ["¿Segura?", "Piénsalo otra vez...", "Ese botón se mueve solo, yo no fui.", "Vane, porfa 🥺", "Ok. Ese botón ya se rindió."];
        var dodges = 0;

        /* busca un hueco donde el "no" no tape la tarjeta ni se salga de pantalla */
        function findSpot(w, h) {
          var pad = 12;
          var card = document.querySelector("#scene-ask .card").getBoundingClientRect();
          var maxX = Math.max(pad, window.innerWidth - w - pad);
          var maxY = Math.max(pad, window.innerHeight - h - pad);
          var gap = 24;

          function clear(x, y) {
            return x + w + gap < card.left || x > card.right + gap || y + h + gap < card.top || y > card.bottom + gap;
          }

          for (var t = 0; t < 60; t++) {
            var x = pad + Math.random() * (maxX - pad);
            var y = pad + Math.random() * (maxY - pad);
            if (clear(x, y)) return { x: x, y: y };
          }

          // sin hueco al azar: nos vamos a la banda más ancha alrededor de la tarjeta
          var bands = [
            { fits: card.top - pad - gap >= h, x: pad + Math.random() * (maxX - pad), y: Math.max(pad, card.top - gap - h) },
            { fits: window.innerHeight - card.bottom - pad - gap >= h, x: pad + Math.random() * (maxX - pad), y: Math.min(maxY, card.bottom + gap) },
            { fits: card.left - pad - gap >= w, x: Math.max(pad, card.left - gap - w), y: pad + Math.random() * (maxY - pad) },
            { fits: window.innerWidth - card.right - pad - gap >= w, x: Math.min(maxX, card.right + gap), y: pad + Math.random() * (maxY - pad) },
          ].filter(function (b) {
            return b.fits;
          });

          if (bands.length) return bands[Math.floor(Math.random() * bands.length)];
          // último recurso: pegado a una esquina
          return { x: Math.random() < 0.5 ? pad : maxX, y: Math.random() < 0.5 ? pad : maxY };
        }

        function dodge() {
          if (dodges >= teases.length) return;
          tease.textContent = teases[dodges];
          dodges++;

          // el sí crece de verdad, el no se va encogiendo
          var grow = Math.min(1 + dodges * 0.45, 2.6);
          yes.style.setProperty("--grow", grow);
          no.style.setProperty("--shrink", Math.max(1 - dodges * 0.13, 0.55));
          // la fila se agranda con él para que no pise el título ni el texto de abajo
          document.querySelector(".ask-row").style.minHeight = yes.offsetHeight * grow + 40 + "px";

          if (dodges >= teases.length) {
            no.disabled = true;
            no.style.opacity = "0.35";
            no.style.cursor = "not-allowed";
            return;
          }

          // fuera de la tarjeta: la escena tiene una animación con transform y eso
          // rompe el position:fixed de los hijos, así que el botón se muda al body
          if (no.parentNode !== document.body) document.body.appendChild(no);
          no.classList.add("is-loose");
          reposition();
        }

        function reposition() {
          if (!no.classList.contains("is-loose")) return;
          var spot = findSpot(no.offsetWidth, no.offsetHeight);
          no.style.left = spot.x + "px";
          no.style.top = spot.y + "px";
        }

        window.addEventListener("resize", reposition);

        ["mouseenter", "touchstart", "focus", "click"].forEach(function (evt) {
          no.addEventListener(
            evt,
            function (e) {
              e.preventDefault();
              dodge();
            },
            { passive: false }
          );
        });

        yes.addEventListener("click", function () {
          burst(window.innerWidth / 2, window.innerHeight * 0.55, 90);
          show("scene-plan");
          render(0);
        });

        /* ------------------------------------------------ el planner */
        var PLAN = [
          {
            q: "¿Cuándo te secuestro?",
            key: "Cuándo",
            type: "date",
            ph: "El día y la hora que tú quieras...",
          },
          {
            q: "¿Qué comemos?",
            key: "Comida",
            options: [
              { e: "🥩", t: "Carnes" },
              { e: "🦐", t: "Marina" },
              { e: "🍝", t: "Pastas" },
              { e: "🍜", t: "Asiática" },
              { e: "🍗", t: "Peruana xd" },
              { e: "✏️", t: "Otra cosa", custom: true, ph: "Yo quiero comer..." },
            ],
          },
          {
            q: "¿Y después?",
            key: "Después",
            options: [
              { e: "🎬", t: "Cine" },
              { e: "🍻", t: "Barra libre con juegos de mesa" },
              { e: "🎮", t: "Cafetería gamer" },
              { e: "✏️", t: "Otra cosa", custom: true, ph: "Después quiero..." },
            ],
          },
        ];

        var picks = [];
        var stepsFill = document.getElementById("steps-fill");
        var stepsDog = document.getElementById("steps-dog");
        var stepsTrack = stepsFill.parentNode;
        var dogTimer = null;

        // una huella por paso a lo largo de la pista
        PLAN.forEach(function (_, n) {
          var paw = document.createElement("span");
          paw.className = "steps__paw";
          paw.style.left = (n / (PLAN.length - 1)) * 100 + "%";
          stepsTrack.appendChild(paw);
        });

        function moveDog(i) {
          var pct = (i / (PLAN.length - 1)) * 100;
          stepsFill.style.width = pct + "%";
          stepsDog.style.left = "calc(1.25rem + (100% - 2.5rem) * " + pct / 100 + ")";
          stepsTrack.querySelectorAll(".steps__paw").forEach(function (p, n) {
            p.classList.toggle("is-done", n <= i);
          });

          if (reduced) return;
          // el perrito corre mientras se mueve
          stepsDog.classList.add("is-running");
          clearTimeout(dogTimer);
          dogTimer = setTimeout(function () {
            stepsDog.classList.remove("is-running");
          }, 700);
        }

        function advance(i) {
          if (i + 1 < PLAN.length) {
            render(i + 1);
          } else {
            finale();
          }
        }

        /* ------------------------------------------------ día + rango de horas */
        var H0 = 10; // la rejilla empieza a las 10:00
        var SLOTS = 28; // ...y son 14 horas en tramos de media hora

        function slotAt(k) {
          var m = H0 * 60 + k * 30;
          var hh = Math.floor(m / 60) % 24;
          return (hh < 10 ? "0" : "") + hh + ":" + (m % 60 ? "30" : "00");
        }

        // el sábado que viene (o hoy, si hoy es sábado) y su domingo
        function weekend() {
          var t = new Date();
          var sat = new Date(t.getFullYear(), t.getMonth(), t.getDate());
          sat.setDate(sat.getDate() + ((6 - sat.getDay() + 7) % 7));
          return [sat, new Date(sat.getFullYear(), sat.getMonth(), sat.getDate() + 1)];
        }

        function cap(s) {
          return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function renderDate(i, step, box) {
          var days = weekend();
          // s y e son índices de tramo: [s, e) — e es exclusivo, como en una agenda
          var state = { day: null, s: null, e: null };

          var wrap = document.createElement("div");
          wrap.className = "picker";
          wrap.innerHTML =
            '<div class="picker__cols">' +
            '<div><p class="picker__label">El día</p><div class="days"></div></div>' +
            '<div><p class="picker__label">La hora</p>' +
            '<div class="cal"><div class="cal__rows"></div>' +
            '<div class="cal__grid"><div class="cal__ghost"></div>' +
            '<div class="cal__block"><span></span>' +
            '<span class="cal__handle cal__handle--t" tabindex="0" role="button" aria-label="Mover la hora de inicio"></span>' +
            '<span class="cal__handle cal__handle--b" tabindex="0" role="button" aria-label="Mover la hora de fin"></span>' +
            "</div></div></div>" +
            '<p class="cal__hint">Toca o arrastra sobre las horas para marcar el rato</p></div></div>' +
            '<p class="picker__out" role="status" aria-live="polite"></p>' +
            '<div class="picker__go"><button class="btn" type="button" disabled>Listo &#8594;</button>' +
            '<button class="btn btn--ghost" type="button">&#9999;&#65039; Otro día</button></div>';

          var daysBox = wrap.querySelector(".days");
          var rows = wrap.querySelector(".cal__rows");
          var grid = wrap.querySelector(".cal__grid");
          var ghost = wrap.querySelector(".cal__ghost");
          var block = wrap.querySelector(".cal__block");
          var blockText = block.querySelector("span");
          var out = wrap.querySelector(".picker__out");
          var go = wrap.querySelectorAll(".picker__go .btn")[0];
          var other = wrap.querySelectorAll(".picker__go .btn")[1];
          grid.setAttribute("aria-label", "Rango de horas");

          function label(d) {
            return cap(d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }));
          }

          function summary(sep) {
            var parts = [];
            if (state.day !== null) parts.push(label(days[state.day]));
            if (state.s !== null) parts.push(slotAt(state.s) + " – " + slotAt(state.e));
            return parts.join(sep || " · ");
          }

          // alto de k tramos, en la misma unidad que usa la rejilla
          function span(k) {
            return "calc(var(--half) * " + k + ")";
          }

          function paint() {
            daysBox.querySelectorAll(".day").forEach(function (b, n) {
              b.classList.toggle("is-on", state.day === n);
              b.setAttribute("aria-pressed", state.day === n);
            });

            var on = state.s !== null;
            block.classList.toggle("is-on", on);
            if (on) {
              block.style.top = span(state.s);
              block.style.height = span(state.e - state.s);
              blockText.textContent = slotAt(state.s) + " – " + slotAt(state.e);
            }
            out.textContent = summary("  ·  ");
            go.disabled = state.day === null || !on;
          }

          /* de la posición del puntero al tramo de media hora */
          function slotFrom(ev) {
            var r = rows.getBoundingClientRect();
            var k = Math.floor(((ev.clientY - r.top) / r.height) * SLOTS);
            return Math.max(0, Math.min(SLOTS - 1, k));
          }

          function setRange(a, b) {
            state.s = Math.max(0, Math.min(a, b));
            state.e = Math.min(SLOTS, Math.max(a, b) + 1);
            paint();
          }

          // un toque sin arrastrar deja un bloque de dos horas, como una cita normal
          function tap(k) {
            if (state.s === null) {
              state.s = Math.min(k, SLOTS - 4);
              state.e = state.s + 4;
            } else if (k < state.s) {
              state.s = k;
            } else if (k >= state.e) {
              state.e = k + 1;
            } else {
              return;
            }
            paint();
          }

          // el puntero se captura para no perder el arrastre al salirse de la rejilla
          function capture(ev) {
            try {
              grid.setPointerCapture(ev.pointerId);
            } catch (err) {
              /* puntero ya soltado: seguimos sin captura */
            }
          }

          var drag = null; // "new" | "top" | "bottom"
          var anchor = 0;
          var moved = false;
          var touch = null;

          grid.addEventListener("pointerdown", function (ev) {
            if (ev.pointerType !== "mouse") {
              // con el dedo esperamos a levantarlo: si se movió, era un scroll
              touch = { k: slotFrom(ev), y: ev.clientY };
              return;
            }
            ev.preventDefault();
            drag = "new";
            moved = false;
            anchor = slotFrom(ev);
            setRange(anchor, anchor);
            capture(ev);
          });

          grid.addEventListener("pointermove", function (ev) {
            var k = slotFrom(ev);
            if (!drag) {
              ghost.style.top = span(k);
              ghost.style.height = span(1);
              return;
            }
            moved = true;
            if (drag === "new") setRange(anchor, k);
            else if (drag === "top") setRange(Math.min(k, state.e - 1), state.e - 1);
            else setRange(state.s, Math.max(k, state.s));
          });

          function endDrag(ev) {
            if (touch) {
              // solo cuenta como toque si el dedo casi no se movió
              if (ev && ev.type === "pointerup" && Math.abs(ev.clientY - touch.y) < 12) tap(touch.k);
              touch = null;
              return;
            }
            // un clic seco de ratón se comporta igual que un toque: dos horas
            if (drag === "new" && !moved) {
              state.s = null;
              tap(anchor);
            }
            drag = null;
          }

          grid.addEventListener("pointerup", endDrag);
          grid.addEventListener("pointercancel", endDrag);

          wrap.querySelectorAll(".cal__handle").forEach(function (hd, n) {
            var which = n === 0 ? "top" : "bottom";
            hd.addEventListener("pointerdown", function (ev) {
              ev.preventDefault();
              ev.stopPropagation();
              drag = which;
              moved = true;
              capture(ev);
            });
            // y con el teclado, media hora por flecha
            hd.addEventListener("keydown", function (ev) {
              var d = ev.key === "ArrowUp" ? -1 : ev.key === "ArrowDown" ? 1 : 0;
              if (!d || state.s === null) return;
              ev.preventDefault();
              if (which === "top") setRange(Math.min(Math.max(state.s + d, 0), state.e - 1), state.e - 1);
              else setRange(state.s, Math.max(Math.min(state.e - 1 + d, SLOTS - 1), state.s));
            });
          });

          // tocar dentro del bloque no lo destruye; para eso están los tiradores
          block.addEventListener("pointerdown", function (ev) {
            ev.stopPropagation();
          });

          days.forEach(function (d, n) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "day";
            b.innerHTML = '<span class="day__wd"></span><span class="day__n"></span><span class="day__m"></span>';
            b.querySelector(".day__wd").textContent = cap(d.toLocaleDateString("es-ES", { weekday: "long" }));
            b.querySelector(".day__n").textContent = d.getDate();
            b.querySelector(".day__m").textContent = d.toLocaleDateString("es-ES", { month: "long" });
            b.addEventListener("click", function () {
              state.day = n;
              paint();
            });
            daysBox.appendChild(b);
          });

          for (var k = 0; k < SLOTS / 2; k++) {
            var row = document.createElement("div");
            row.className = "cal__row";
            row.innerHTML = '<span class="cal__t"></span>';
            row.querySelector(".cal__t").textContent = slotAt(k * 2);
            rows.appendChild(row);
          }

          go.addEventListener("click", function () {
            var r = go.getBoundingClientRect();
            burst(r.left + r.width / 2, r.top + r.height / 2, 22);
            picks[i] = { key: step.key, emoji: "📅", text: summary() };
            advance(i);
          });

          other.addEventListener("click", function () {
            askCustom(i, step, step, box);
          });

          box.appendChild(wrap);
          paint();
        }

        /* el "escríbelo tú": la opción se convierte en un campo de texto */
        function askCustom(i, step, opt, box) {
          box.innerHTML = "";
          var wrap = document.createElement("div");
          wrap.className = "custom";
          wrap.innerHTML =
            '<input type="text" maxlength="60" /><button class="btn" type="button">Listo</button><button class="btn btn--ghost" type="button">Volver</button>';
          var input = wrap.querySelector("input");
          var buttons = wrap.querySelectorAll("button");
          input.placeholder = opt.ph || "Escríbelo tú...";
          input.setAttribute("aria-label", step.q);

          function ok() {
            var v = input.value.trim();
            if (!v) {
              input.focus();
              return;
            }
            var r = input.getBoundingClientRect();
            burst(r.left + r.width / 2, r.top + r.height / 2, 22);
            picks[i] = { key: step.key, emoji: "✏️", text: v };
            advance(i);
          }

          buttons[0].addEventListener("click", ok);
          buttons[1].addEventListener("click", function () {
            render(i);
          });
          input.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter") {
              ev.preventDefault();
              ok();
            }
          });

          box.appendChild(wrap);
          input.focus();
        }

        function render(i) {
          var step = PLAN[i];
          document.getElementById("plan-eyebrow").textContent = "Paso " + (i + 1) + " de " + PLAN.length;
          document.getElementById("plan-question").textContent = step.q;
          moveDog(i);

          var box = document.getElementById("plan-options");
          box.innerHTML = "";

          if (step.type === "date") {
            renderDate(i, step, box);
            return;
          }

          step.options.forEach(function (opt) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "option";
            b.innerHTML = '<span class="emoji" aria-hidden="true"></span><span class="t"></span>';
            b.querySelector(".emoji").textContent = opt.e;
            b.querySelector(".t").textContent = opt.t;
            b.addEventListener("click", function (ev) {
              ev.stopPropagation();
              if (opt.custom) {
                askCustom(i, step, opt, box);
                return;
              }
              var r = b.getBoundingClientRect();
              burst(r.left + r.width / 2, r.top + r.height / 2, 18);
              picks[i] = { key: step.key, emoji: opt.e, text: opt.t };
              advance(i);
            });
            box.appendChild(b);
          });
        }

        /* ------------------------------------------------ el aviso a Jans */
        var sent = false;

        function notify() {
          if (sent || !FORM_ENDPOINT) return;
          sent = true;

          var data = { _subject: "Vane dijo que sí 💌" };
          picks.forEach(function (p) {
            data[p.key] = p.emoji + " " + p.text;
          });
          data.resumen = picks
            .map(function (p) {
              return p.key + ": " + p.text;
            })
            .join(" · ");

          // silencioso a propósito: si falla, la página ni se entera
          try {
            fetch(FORM_ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify(data),
              keepalive: true,
            }).catch(function () {});
          } catch (err) {
            /* navegador sin fetch: se queda sin aviso, y ya */
          }
        }

        /* ------------------------------------------------ el final */
        function finale() {
          notify();
          var recap = document.getElementById("recap");
          recap.innerHTML = "";
          picks.forEach(function (p, i) {
            var row = document.createElement("div");
            row.className = "recap-row";
            row.style.animationDelay = reduced ? "0s" : 0.35 + i * 0.18 + "s";
            row.innerHTML = '<span class="emoji" aria-hidden="true"></span><span><span class="k"></span><span class="v"></span></span>';
            row.querySelector(".emoji").textContent = p.emoji;
            row.querySelector(".k").textContent = p.key;
            row.querySelector(".v").textContent = p.text;
            recap.appendChild(row);
          });

          show("scene-end");
          document.getElementById("live").textContent = "Es una cita.";

          if (!reduced) {
            document.querySelector(".stage").classList.add("shake");
            setTimeout(function () {
              document.querySelector(".stage").classList.remove("shake");
            }, 700);
          }
          // la explosión de corazones, en tres tandas
          burst(window.innerWidth / 2, window.innerHeight * 0.42, 140);
          setTimeout(function () {
            burst(window.innerWidth * 0.2, window.innerHeight * 0.6, 60);
          }, 260);
          setTimeout(function () {
            burst(window.innerWidth * 0.8, window.innerHeight * 0.6, 60);
          }, 420);
        }

        /* ------------------------------------------------ corazones */
        var canvas = document.getElementById("sky");
        var ctx = canvas.getContext("2d");
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var drifting = [];
        var flying = [];

        function size() {
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        size();
        window.addEventListener("resize", size);

        function heart(x, y, s, rot, color, alpha) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rot);
          ctx.scale(s, s);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(0, 3);
          ctx.bezierCurveTo(0, 1, -2, -2.5, -5, -2.5);
          ctx.bezierCurveTo(-9.5, -2.5, -9.5, 3, -9.5, 3);
          ctx.bezierCurveTo(-9.5, 6, -6.5, 9.5, 0, 13);
          ctx.bezierCurveTo(6.5, 9.5, 9.5, 6, 9.5, 3);
          ctx.bezierCurveTo(9.5, 3, 9.5, -2.5, 5, -2.5);
          ctx.bezierCurveTo(2, -2.5, 0, 1, 0, 3);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        var PALETTE = ["#ff5d7e", "#ff9ec2", "#f4c77b", "#c9184a", "#ffd9e2"];

        function pick() {
          return PALETTE[Math.floor(Math.random() * PALETTE.length)];
        }

        // corazones de fondo, subiendo despacio para siempre
        var ambient = reduced ? 0 : window.innerWidth < 640 ? 16 : 30;
        for (var i = 0; i < ambient; i++) {
          drifting.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            s: 0.25 + Math.random() * 0.5,
            vy: -(0.12 + Math.random() * 0.28),
            sway: Math.random() * Math.PI * 2,
            color: pick(),
            alpha: 0.1 + Math.random() * 0.22,
          });
        }

        function burst(x, y, count) {
          if (reduced) return;
          for (var i = 0; i < count; i++) {
            var a = Math.random() * Math.PI * 2;
            var v = 2 + Math.random() * 8;
            flying.push({
              x: x,
              y: y,
              vx: Math.cos(a) * v,
              vy: Math.sin(a) * v - 2,
              s: 0.3 + Math.random() * 0.8,
              rot: Math.random() * Math.PI * 2,
              spin: (Math.random() - 0.5) * 0.18,
              life: 1,
              decay: 0.006 + Math.random() * 0.011,
              color: pick(),
            });
          }
          // techo de partículas, para no ahogar un celular
          if (flying.length > 420) flying.splice(0, flying.length - 420);
        }

        function frame() {
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          drifting.forEach(function (h) {
            h.y += h.vy;
            h.sway += 0.01;
            if (h.y < -20) {
              h.y = window.innerHeight + 20;
              h.x = Math.random() * window.innerWidth;
            }
            heart(h.x + Math.sin(h.sway) * 18, h.y, h.s, Math.sin(h.sway) * 0.25, h.color, h.alpha);
          });

          for (var i = flying.length - 1; i >= 0; i--) {
            var p = flying[i];
            p.vy += 0.12; // gravedad
            p.vx *= 0.985;
            p.vy *= 0.985;
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.spin;
            p.life -= p.decay;
            if (p.life <= 0 || p.y > window.innerHeight + 40) {
              flying.splice(i, 1);
              continue;
            }
            heart(p.x, p.y, p.s, p.rot, p.color, Math.max(p.life, 0));
          }

          requestAnimationFrame(frame);
        }
        frame();
      })();
    </script> </body> </html>
